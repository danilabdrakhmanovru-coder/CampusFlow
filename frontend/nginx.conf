map $http_x_forwarded_proto $campusflow_scheme {
    default $scheme;
    https https;
}
server {
    listen 8080;
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    client_max_body_size 22m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api api:8000;
        proxy_pass http://$api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $campusflow_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
